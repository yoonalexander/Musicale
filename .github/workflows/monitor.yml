name: Monitor daily availability
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
jobs:
  availability:
    if: vars.MUSICALE_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/monitor.mjs
        env:
          MUSICALE_MONITOR_URL: ${{ vars.MUSICALE_MONITOR_URL }}
          MUSICALE_ALERT_EMAIL: ${{ secrets.MUSICALE_ALERT_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
