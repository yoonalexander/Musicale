name: Verify Musicale
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Start virtual audio output for browser playback
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=musicale_test
          pactl set-default-sink musicale_test
      - name: Start isolated local backend
        run: npm run local:start > /tmp/musicale-supabase.log 2>&1
      - run: npm run test:ui:cleanup
      - run: npm run verify
      - run: npm audit
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 3
      - name: Stop local backend
        if: always()
        run: npm run local:stop
